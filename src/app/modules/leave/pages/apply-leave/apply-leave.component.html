<app-leave-navbar></app-leave-navbar>
<div class="grid mx-auto px-4 py-4 sm:px-8 lg:container">
    <div class="grid grid-cols-1 gap-4 md:grid-cols-2 lg:grid-cols-2 xl:grid-cols-">
        <div class="md:col-span-2 mx-5 xl:col-span-3">
            <div class="flex-row rounded-lg bg-background px-8 py-4 sm:flex-row">
                <form #leaveForm="ngForm" class="max-w-screen-xl mx-auto">
                    <h2 class="text-lg">Create New Request</h2>

                    <div id="time-off-trigger" class="trigger text-sm text-blue-500 hover:underline cursor-pointer"
                        (click)="showPopup()">
                        Time Off (Leave) Requests and Balances
                    </div>

                    <p-dialog [(visible)]="displayPopup" [modal]="true"
                        [style]="{ width: '90vw', maxWidth: '1000px', height: '90vh'}">
                        <ng-template pTemplate="header">
                            <div class="text-base font-normal">Time Off (Leave) Requests and Balances</div>
                        </ng-template>
                        <app-time-off-popup [displayPopup]="displayPopup"></app-time-off-popup>
                    </p-dialog>

                    <hr class="w-2xl h-px mx-auto mb-2 bg-gray-300 border-0 rounded md:mb-3 dark:bg-gray-600">

                    <div class="grid md:grid-cols-4 md:gap-4">
                        <div class="grid md:grid-rows-1 md:gap-1 md:col-span-2">
                            <div class="col-span-2 flex flex-col gap-4">
                                <div class="relative z-0 w-full mt-4 group flex items-center space-x-2">
                                    <label for="request_type"
                                        class="font-medium text-gray-900 dark:text-white text-xs whitespace-nowrap">Request
                                        Type* : </label>
                                    <select id="request_type"
                                        class="text-xs bg-gray-50 border border-gray-300 text-gray-900 rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500">
                                        <option value="">--Select--</option>
                                        <option *ngFor="let type of requestType" [value]="type.type_id">
                                            {{ type.type_name }}
                                        </option>
                                    </select>
                                </div>

                                <div class="relative z-0 w-full mt-4 group flex items-center space-x-2">
                                    <label for="date-range-picker"
                                        class="font-medium text-gray-900 dark:text-white text-xs whitespace-nowrap">From
                                        Date* :</label>

                                    <div class="relative max-w-sm">
                                        <div
                                            class="absolute inset-y-0 start-0 flex items-center ps-3 pointer-events-none">
                                            <svg class="w-4 h-4 text-gray-500 dark:text-gray-400" aria-hidden="true"
                                                xmlns="http://www.w3.org/2000/svg" fill="currentColor"
                                                viewBox="0 0 20 20">
                                                <path
                                                    d="M20 4a2 2 0 0 0-2-2h-2V1a1 1 0 0 0-2 0v1h-3V1a1 1 0 0 0-2 0v1H6V1a1 1 0 0 0-2 0v1H2a2 2 0 0 0-2 2v2h20V4ZM0 18a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8H0v10Zm5-8h10a1 1 0 0 1 0 2H5a1 1 0 0 1 0-2Z" />
                                            </svg>
                                        </div>
                                        <input id="datepicker-autohide" datepicker datepicker-autohide type="text"
                                            class="bg-gray-50 border border-gray-300 text-gray-900 text-xs rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full ps-10 p-2. dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
                                            placeholder="Select date">
                                    </div>
                                </div>

                                <div class="relative z-0 w-full mt-4 group flex items-center space-x-2">
                                    <label for="date-range-picker"
                                        class="font-medium text-gray-900 dark:text-white text-xs whitespace-nowrap">To
                                        Date* :</label>

                                    <div class="relative max-w-sm">
                                        <div
                                            class="absolute inset-y-0 start-0 flex items-center ps-3 pointer-events-none">
                                            <svg class="w-4 h-4 text-gray-500 dark:text-gray-400" aria-hidden="true"
                                                xmlns="http://www.w3.org/2000/svg" fill="currentColor"
                                                viewBox="0 0 20 20">
                                                <path
                                                    d="M20 4a2 2 0 0 0-2-2h-2V1a1 1 0 0 0-2 0v1h-3V1a1 1 0 0 0-2 0v1H6V1a1 1 0 0 0-2 0v1H2a2 2 0 0 0-2 2v2h20V4ZM0 18a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8H0v10Zm5-8h10a1 1 0 0 1 0 2H5a1 1 0 0 1 0-2Z" />
                                            </svg>
                                        </div>
                                        <input id="datepicker-autohide" datepicker datepicker-autohide type="text"
                                            class="bg-gray-50 border border-gray-300 text-gray-900 text-xs rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full ps-10 p-2. dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
                                            placeholder="Select date">
                                    </div>
                                </div>

                                <div class="relative z-0 w-full mt-4 group flex items-center space-x-2">
                                    <label for="partial_day"
                                        class="font-medium text-gray-900 dark:text-white text-xs whitespace-nowrap">Partial
                                        Days* : </label>
                                    <select id="partial_day"
                                        class="text-xs bg-gray-50 border border-gray-300 text-gray-900 rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500">
                                        <option value="">--Select--</option>
                                        <option *ngFor="let partial of requestPartial" [value]="partial.partial_id">
                                            {{ partial.partial_name }}
                                        </option>
                                    </select>
                                </div>

                                <div class="relative z-0 w-full mt-4 group flex items-center space-x-2">
                                    <label for="reasons"
                                        class="font-medium text-gray-900 dark:text-white text-xs whitespace-nowrap">Reason*
                                        : </label>
                                    <select id="reasons"
                                        class="text-xs bg-gray-50 border border-gray-300 text-gray-900 rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500">
                                        <option value="">--Select--</option>
                                        <option *ngFor="let reason of requestReason" [value]="reason.reason_id">
                                            {{ reason.reason_name }}
                                        </option>
                                    </select>
                                </div>

                                <div class="relative z-0 w-full mt-4 mb-1 group">
                                    <label for="reason_details"
                                        class="font-medium text-gray-900 dark:text-white text-xs whitespace-nowrap">Reason
                                        Details:</label>
                                    <textarea id="message" rows="4"
                                        class="text-xs bg-gray-50 border border-gray-300 text-gray-900 rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
                                        placeholder="Write your reason details here..."></textarea>
                                </div>
                            </div>
                        </div>
                        <div class="grid md:grid-rows-1 md:gap-1 md:col-span-2">
                            <div class="col-span-2 flex flex-col gap-4">
                                <div class="relative z-0 w-full mt-4 group flex items-center space-x-2">
                                    <label for="duration"
                                        class="font-medium text-gray-900 dark:text-white text-xs whitespace-nowrap">Duration:</label>
                                    <input type="text" id="duration" placeholder="Type for hints..."
                                        class="text-xs bg-gray-50 border border-gray-300 text-gray-900 rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500">
                                </div>

                                <div class="relative z-0 w-full mt-4 group flex items-center space-x-2">
                                    <label for="approver"
                                        class="font-medium text-gray-900 dark:text-white text-xs whitespace-nowrap">Approver*
                                        : </label>
                                    <select id="approver"
                                        class="text-xs bg-gray-50 border border-gray-300 text-gray-900 rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500">
                                        <option value="">--Select--</option>
                                        <option *ngFor="let approver of requestApprover" [value]="approver.user_id">
                                            {{ approver.user_name }}
                                        </option>
                                    </select>
                                </div>

                                <div class="relative z-0 w-full mt-4 group flex items-center space-x-2">
                                    <label for="date-range-picker"
                                        class="font-medium text-gray-900 dark:text-white text-xs whitespace-nowrap">Excepted
                                        Approve :</label>

                                    <div class="relative max-w-sm">
                                        <div
                                            class="absolute inset-y-0 start-0 flex items-center ps-3 pointer-events-none">
                                            <svg class="w-4 h-4 text-gray-500 dark:text-gray-400" aria-hidden="true"
                                                xmlns="http://www.w3.org/2000/svg" fill="currentColor"
                                                viewBox="0 0 20 20">
                                                <path
                                                    d="M20 4a2 2 0 0 0-2-2h-2V1a1 1 0 0 0-2 0v1h-3V1a1 1 0 0 0-2 0v1H6V1a1 1 0 0 0-2 0v1H2a2 2 0 0 0-2 2v2h20V4ZM0 18a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8H0v10Zm5-8h10a1 1 0 0 1 0 2H5a1 1 0 0 1 0-2Z" />
                                            </svg>
                                        </div>
                                        <input id="datepicker-autohide" datepicker datepicker-autohide type="text"
                                            class="bg-gray-50 border border-gray-300 text-gray-900 text-xs rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full ps-10 p-2. dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
                                            placeholder="Select date">
                                    </div>
                                </div>

                                <div class="relative z-0 w-full mt-4 group flex items-center space-x-2">
                                    <label for="suppervisor"
                                        class="font-medium text-gray-900 dark:text-white text-xs whitespace-nowrap">Suppervisor*
                                        : </label>
                                    <select id="suppervisor"
                                        class="text-xs bg-gray-50 border border-gray-300 text-gray-900 rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500">
                                        <option value="">--Select--</option>
                                        <option *ngFor="let suppervisor of requestSuppervisor"
                                            [value]="suppervisor.user_id">
                                            {{ suppervisor.user_name }}
                                        </option>
                                    </select>
                                </div>

                                <div class="relative z-0 w-full mt-4 group flex items-center space-x-2">
                                    <label for="inform_to"
                                        class="font-medium text-gray-900 dark:text-white text-xs whitespace-nowrap">Inform
                                        To
                                        : </label>
                                    <select id="inform_to"
                                        class="text-xs bg-gray-50 border border-gray-300 text-gray-900 rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500">
                                        <option value="">--Select--</option>
                                        <option *ngFor="let informTo of requestInformTo" [value]="informTo.user_id">
                                            {{ informTo.user_name }}
                                        </option>
                                    </select>
                                </div>

                                <div class="relative z-0 w-full mt-4 group flex items-center space-x-2">
                                    <label for="time"
                                        class="font-medium text-gray-900 dark:text-white text-xs whitespace-nowrap">Time
                                        : </label>
                                    <input type="text" maxlength="2" placeholder="12"
                                        class="w-16 text-center border border-gray-300 rounded-md bg-gray-50 focus:ring-blue-500 focus:border-blue-500 text-sm text-gray-900 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" />

                                    <span class="text-gray-500">:</span>

                                    <input type="text" maxlength="2" placeholder="00"
                                        class="w-16 text-center border border-gray-300 rounded-md bg-gray-50 focus:ring-blue-500 focus:border-blue-500 text-sm text-gray-900 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" />

                                    <select
                                        class="w-20 border border-gray-300 rounded-md bg-gray-50 focus:ring-blue-500 focus:border-blue-500 text-sm text-gray-900 dark:bg-gray-700 dark:border-gray-600 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500">
                                        <option value="AM">AM</option>
                                        <option value="PM">PM</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>

                    <hr class="w-2xl h-px mx-auto my-2 bg-gray-300 border-0 rounded md:my-3 dark:bg-gray-600">

                    <div class="grid md:grid-cols-8 md:gap-2 justify-end">
                        <div class="col-span-6"></div>
                        <button type="button"
                            class="text-sm text-bg-blue-700 white border-2 rounded-full border-bg-blue-700 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium w-full sm:w-auto px-4 py-2 text-center dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800">
                            Cancel
                        </button>
                        <button type="submit"
                            class="text-sm text-white rounded-full bg-blue-500 hover:bg-blue-500 focus:ring-4 focus:outline-none focus:ring-blue-400 font-medium w-10 sm:w-auto px-4 py-2 text-center">
                            + Apply
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
