<app-admin-navbar></app-admin-navbar>
<p-toast></p-toast>
<div class="grid mx-auto px-4 py-4 sm:px-8 lg:container">
  <div class="grid grid-cols-1 gap-4 md:grid-cols-2 lg:grid-cols-2 xl:grid-cols-">
    <div class="md:col-span-2 mx-5 xl:col-span-3">
      <div class="flex-col rounded-lg bg-background px-8 py-8 sm:flex-row">
        <form class="max-w-screen-xl mx-auto">

          <h2 class="text-lg">System Users</h2>

          <hr class="w-2xl h-px mx-auto my-3 bg-gray-300 border-0 rounded md:my-3 dark:bg-gray-600">

          <div class="grid md:grid-cols-4 md:gap-6">
            <div class="relative z-0 w-full mb-5 group">
              <label for="user-name"
                class="block mb-2  font-medium text-gray-900 dark:text-white text-xs">User
                Name</label>
              <input type="text" id="user-name" placeholder="Type for hints..." name="searchEmployee"
                class="text-xs bg-gray-50 border border-gray-300 text-gray-900 rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500">
            </div>

            <div class="relative z-0 w-full mb-5 group">
              <label for="user-role"
                class="block mb-2 font-medium text-gray-900 dark:text-white text-xs">User Role</label>
              <select id="user-role" name="searchEmployeeStatus"
                class="text-xs bg-gray-50 border border-gray-300 text-gray-900 rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500">
                <option>--Select--</option>
                <option>Admin</option>
                <option>User</option>
              </select>
            </div>

            <div class="relative z-0 w-full mb-5 group">
              <label for="employee-name"
                class="block mb-2 font-medium text-gray-900 dark:text-white text-xs">Employee
                Name</label>
              <input type="text" id="employee-name" placeholder="Type for hints..."
                class="text-xs bg-gray-50 border border-gray-300 text-gray-900 rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500">
            </div>

            <div class="relative z-0 w-full mb-5 group">
              <label for="status"
                class="block mb-2 font-medium text-gray-900 dark:text-white text-xs">Status</label>
              <select id="status"
                class="text-xs bg-gray-50 border border-gray-300 text-gray-900 rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500">
                <option>--Select--</option>
                <option>Enabled</option>
                <option>Disabled</option>
              </select>
            </div>
          </div>

          <div class="grid mt-2 md:grid-cols-8 md:gap-2 justify-end">
            <div class="col-span-6"></div>
            <button type="submit"
              class="text-sm text-green-400 border-2 rounded-full border-green-400 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium w-full sm:w-auto px-2 py-1.5 text-center dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800">
              Cancel
            </button>
            <button type="submit"
              class="text-sm text-white rounded-full bg-green-400 hover:bg-green-500 focus:ring-4 focus:outline-none focus:ring-green-300 font-medium w-full sm:w-auto px-2 py-1.5 text-center">
              Search
            </button>
          </div>
        </form>
      </div>
    </div>

    <div class="md:col-span-2 mx-5 xl:col-span-3">
      <div class="flex-col rounded-lg bg-background px-8 py-8 sm:flex-row">
          <div class="relative overflow-x-auto">
              <!-- Add Button -->
              <button type="submit"
                  class="text-sm text-white rounded-full bg-green-400 hover:bg-green-500 focus:ring-4 focus:outline-none focus:ring-green-300 font-medium w-full sm:w-auto px-9 py-2 text-center">
                  + Add
              </button>

              <hr class="w-2xl h-px mx-auto my-3 bg-gray-300 border-0 rounded md:my-3 dark:bg-gray-600">

              <!-- Table -->
              <div class="p-card p-card-custom">
                  <p-table class="rounded-lg" #dt [tableStyle]="{'min-width': '50rem'}"
                      [rowHover]="true" [filterDelay]="0" [paginator]="true" [rows]="10"
                      [totalRecords]="100" sortMode="multiple" [showCurrentPageReport]="true"
                      currentPageReportTemplate="Showing {first} to {last} of {totalRecords} Employee"
                      responsiveLayout="scroll">
                      <ng-template pTemplate="header">
                          <tr>
                              <th>User Name</th>
                              <th>User Role</th>
                              <th>Employee Name</th>
                              <th>Status</th>
                              <th>Actions</th>
                          </tr>
                      </ng-template>
                      <ng-template pTemplate="body" let-leave let-i="rowIndex">
                          <tr>
                              <td style="width: 15%; min-width: 4rem;">{{leave.employeeName}}</td>
                              <td style="width: 15%; min-width: 4rem;">{{leave.employeeName}}</td>
                              <td style="width: 15%; min-width: 4rem;">{{leave.leaveType}}</td>
                              <td style="width: 15%; min-width: 4rem;">{{leave.leaveStatus}}</td>
                              <td style="width: 10%; min-width: 4rem; text-align: center;">
                                  <!-- Delete button -->
                                  <button pButton pRipple type="button" icon="pi pi-trash"
                                  class="p-button p-component p-button-text p-button-icon-only p-button-danger"></button>
                                <div id="overlay" class="hidden fixed inset-0 bg-black bg-opacity-50 z-40"></div>
                              </td>
                          </tr>
                      </ng-template>
                  </p-table>
              </div>
          </div>
      </div>
  </div>
  </div>
</div>
